[package]
name = "excalidraw-desktop"
version = "1.0.0"
description = "Excalidraw Desktop - lightweight offline whiteboard for Windows"
authors = ["excalidrawer"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# smaller exe: strip symbols (opt-level stays default for canvas perf)
strip = true
